<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="450"
  viewBox="0 0 1120 450"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">自动形式化的语义与执行检查接口</title>
  <desc id="desc">
    自然语言经过形式化生成形式表示，再由形式工具产生答案、反例或证明。语义检查核对原文与表示，执行检查核对表示与结论。
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#0f6c8e" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1120" height="450" rx="16" fill="#f8fbfc" />
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#16384a">
    <text x="42" y="42" font-size="16" letter-spacing="2" fill="#537181">
      AUTOFORMALIZATION · TWO VERIFICATION INTERFACES
    </text>
    <g fill="#fff" stroke="#b5ced9" stroke-width="1.5">
      <rect x="40" y="94" width="280" height="138" rx="12" />
      <rect x="420" y="94" width="280" height="138" rx="12" />
      <rect x="800" y="94" width="280" height="138" rx="12" />
    </g>
    <g text-anchor="middle">
      <text x="180" y="132" font-size="16" fill="#537181">01 / NATURAL LANGUAGE</text>
      <text x="180" y="171" font-size="27" font-weight="600">原文与上下文</text>
      <text x="180" y="204" font-size="18">陈述 · 规则 · 约束 · 证明</text>
      <text x="560" y="132" font-size="16" fill="#537181">02 / FORMAL REPRESENTATION</text>
      <text x="560" y="171" font-size="27" font-weight="600">形式表示与假设</text>
      <text x="560" y="204" font-size="18">类型 · 量词 · 定义 · 依赖</text>
      <text x="940" y="132" font-size="16" fill="#537181">03 / FORMAL REASONING</text>
      <text x="940" y="171" font-size="27" font-weight="600">求解与证明证据</text>
      <text x="940" y="204" font-size="18">答案 · 反例 · 证明义务</text>
      <text x="369" y="144" font-size="17" fill="#0f6c8e">形式化</text>
      <text x="749" y="144" font-size="17" fill="#0f6c8e">形式工具</text>
    </g>
    <g stroke="#0f6c8e" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M332 168 H401" />
      <path d="M712 168 H781" />
    </g>
    <g>
      <rect x="40" y="276" width="510" height="133" rx="12" fill="#e7f2f7" />
      <rect x="570" y="276" width="510" height="133" rx="12" fill="#edf3ed" />
      <text x="64" y="311" font-size="23" font-weight="600" fill="#0f6c8e">接口一：语义检查</text>
      <text x="64" y="347" font-size="20">形式表示是否保留了原文含义？</text>
      <text x="64" y="382" font-size="17" fill="#537181">比较解释、约束、区分情形与剩余歧义</text>
      <text x="594" y="311" font-size="23" font-weight="600" fill="#406745">接口二：执行检查</text>
      <text x="594" y="347" font-size="20">结论是否由给定形式表示支持？</text>
      <text x="594" y="382" font-size="17" fill="#537181">检查类型、可满足性、证明与工具边界</text>
    </g>
  </g>
</svg>
