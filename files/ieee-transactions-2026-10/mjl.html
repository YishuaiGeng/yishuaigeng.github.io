  <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "mainEntity": [
          {
            "@type": "Question",
            "name": "What Is Master Journal List?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Master Journal List is an invaluable tool to help you to find the right journal for your needs across multiple indices hosted on the Web of Science platform. Spanning all disciplines and regions, Web of Science Core Collection is at the heart of the Web of Science platform. Curated with care by an expert team of in-house editors, Web of Science Core Collection includes only journals that demonstrate high levels of editorial rigor and best practice. As well as the Web of Science Core Collection, you can search across the following specialty collections: Biological Abstracts, BIOSIS Previews, Zoological Record, and Current Contents Connect, as well as the Chemical Information products."
            }
          },
          {
            "@type": "Question",
            "name": "Which Journals Are Included in Master Journal List?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Master Journal List includes all journals indexed in Web of Science, including the complete list of journal in the Web of Science Core Collection (including Science Citation Index Expanded, Social Sciences Citation Index, Arts & Humanities Citation Index, and Emerging Sources Citation Index), Biological Abstracts, BIOSIS Previews, Zoological Record, and Current Contents Connect, as well as the Chemical Information products."
            }
          },
          {
            "@type": "Question",
            "name": "Do I Have to Create an Account to Use Master Journal List?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Users are required to create a free account and log in to use Manuscript Matcher, view journal profile pages, submit journals for evaluation, and request status of journal evaluation; all other information is available to view without logging in."
            }
          },
          {
            "@type": "Question",
            "name": "Can I Submit to a Journal for Inclusion Directly Through Master Journal List?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Publishers may submit journals to Web of Science for evaluation via the journal submission form."
            }
          },
          {
            "@type": "Question",
            "name": "Can I Download the Master Journal List?",
            "acceptedAnswer": {
              "@type": "Answer",

            }
          }

  <script>
    //
    // Function here used only for IE with some tweaks so it'll work for login page
    //
    function runForLoginIFrameForIE() {
      let eventMethod = window.addEventListener
        ? 'addEventListener'
        : 'attachEvent';

      let eventer = window[eventMethod];
      let messageEvent =
        eventMethod === 'attachEvent' ? 'onmessage' : 'message';
      let errorTimeout;
      let loginFrame;
      let iframeErrorMsg;
      let spinner;
      let isIframeAlreadyRendered = false;
      // check if iframe is loaded or not
      setTimeout(function () {
        errorTimeout = setTimeout(error, 8000);
      }, 10);
      // Listen to message from child window

      window.addEventListener('message', function (e) {
        let urlRegex = new RegExp('access\.(.*)\.?clarivate\.com', 'g');
        let isClarivateDomain =
          urlRegex.test(e.origin) ||
          e.origin == 'http://local.1p.clarivate.com:1981';

        spinner = document.getElementById('iframe-spinner');
        loginFrame = document.getElementById('loginIframe');

        if (isClarivateDomain && e.data === 'loaded') {
          spinner.style.display = 'none';
          loginFrame.style.display = 'block';
          isIframeAlreadyRendered = true;
          clearTimeout(errorTimeout);
          e.source.postMessage('url:' + window.location.href, '*');
        } else if (isClarivateDomain && e.data.length) {
          localStorage.setItem('ca.token', e.data);
          window.location.href = window['base-href'] + 'login-redirect';
        }
      });

      function error() {
        loginFrame = document.getElementById('loginIframe');
        iframeErrorMsg = document.getElementById('iframe-error-msg');
        spinner = document.getElementById('iframe-spinner');
        loginFrame.style.display = 'none';
        iframeErrorMsg.style.display = 'block';
        spinner.style.display = 'none';
      }
    }
  </script>

    <!-- Handle browser back button -->
    <script>
      //
      // Handle legacy case where we start app at /mjl-beta/xxx then set base-href which sets APP_BASE_HREF in app
      // Otherwise set default app base path to / (new way)
      // TODO: Once we remove old app paths and
      //
      // var winLocationPathname = window.location.pathname;

      var winLocationPathname = window.location.pathname;
      if (winLocationPathname.indexOf('/mjl') > -1) {
        winLocationPathname ='/mjl/';
        window['base-href'] = winLocationPathname;
      } else {
        window['base-href'] ='/';
      }

    console.log('App set root base-href: ' + window['base-href']);
    console.log("Deploy url", winLocationPathname);
    window.addEventListener(
      'popstate',
      function (e) {
        console.log(
          '*** window.onpopstate + ' +
          window.location.href +
          ' ' +
          e.state.search_id
        );
        localStorage.setItem('search_back_hash', e.state.search_id);

        if (document.getElementById('hiddenBackButton') !== null) {
          document.getElementById('hiddenBackButton').click(); // Primary way to do it (works nicest)
        } else {
          localStorage.setItem('hiddenBackButtonPress', 'Y'); // Fallback way when we are going back to search results from another page
        }
      },
      false
    );

    //
    // Grab browser events for push/pop state
    // This also handles back button where 2 replaceStates() come in for same page - one has our search hash and one does not. We need to preserve it.
    //
    // JS: Note: Does not work on IE11
    //
    const isIEOrEdge2 = /msie\s|trident\/|edge\//i.test(
      window.navigator.userAgent
    );
    if (!isIEOrEdge2) {
      var _wr = function (type) {
        var orig = history[type];
        return function () {
          var rv = orig.apply(this, arguments);
          var e = new Event(type);
          e.arguments = arguments;
          window.dispatchEvent(e);
          return rv;
        };
      };
      (history.pushState = _wr('pushState')),
        (history.replaceState = _wr('replaceState'));

      window.addEventListener('replaceState', function (e) {
        if (
          e.arguments != null &&
          e.arguments[0] &&
          e.arguments[0].search_id
        ) {
          console.log(
            '*** window.replace state = ' + e.arguments[0].search_id
          );
        } else {
          console.log('*** window.replace state = ' + e);

          // We did a replace state. Sometimes this gets doubled second time without search id hash
          // If we're on search results AND we have no search hash and we have one in memory from last time then set that...
          if (
            window.location.href.indexOf('search-results') > -1 ||
            window.location.href.indexOf('manuscript-matcher') > -1
          ) {
            if (
              localStorage.getItem('search_back_hash') &&
              localStorage.getItem('search_back_hash').length > 0
            ) {
              console.log(
                '*** window.replace state did not find old search id.. resetting to ' +
                localStorage.getItem('search_back_hash')
              );
              history.replaceState(
                {
                  search_id: localStorage.getItem('search_back_hash'),
                  search_text: '',
                },
                null,
                window.location.href
              );
            }
          }
        }
      });
      /* Uncomment for debugging
      *
      window.addEventListener('pushState', function(e) {
        if (e.arguments != null && e.arguments[0] && e.arguments[0].search_id) {
          console.log('*** window.push state = ' + e.arguments[0].search_id);
        } else {
          console.log('*** window.push state = ' + e);
        }
      });*/
    }
  </script>
